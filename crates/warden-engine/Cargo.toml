[package]
name = "warden-engine"
version = "0.1.3"
edition = "2021"
description = "Rust crypto engine for Warden — JWT, HMAC, constant-time comparison"

[dependencies]
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
subtle = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
