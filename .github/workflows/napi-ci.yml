name: warden-napi-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Differentiated by event_name so a workflow_dispatch publish run is not
  # cancelled by a subsequent push to main mid-flight.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # 5-platform NAPI matrix (Story 52.1). warden's `package.json` declares
  # `@c9up/sigil: workspace:*` in devDependencies (used only by
  # `tests/integration/warden-sigil-smoke.test.ts`). A standalone
  # `pnpm install` in warden's submodule repo crashes on the workspace
  # protocol because there's no parent workspace and `@c9up/*` aren't on
  # npm yet. Mitigation (mirrors warden 40.4 cross-package smoke gate):
  # synthesize a minimal pnpm workspace stub on the runner with warden +
  # sigil as workspace members so the protocol resolves. The matrix vitest
  # runs `--run tests/unit` (excludes the integration smoke test that
  # imports sigil at runtime) so the matrix proves the NAPI binary works
  # cross-platform without needing sigil's NAPI also built per-platform.
  build-and-test:
    name: Build & test (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    suffix: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, suffix: linux-arm64-gnu }
          - { os: macos-13,         suffix: darwin-x64 }
          - { os: macos-14,         suffix: darwin-arm64 }
          - { os: windows-latest,   suffix: win32-x64-msvc }
    defaults:
      run:
        working-directory: ws
    steps:
      - name: Checkout warden into workspace stub
        uses: actions/checkout@v4
        with:
          path: ws/packages/warden

      # Sibling clone of sigil's standalone repo. If sigil is private,
      # provision a PAT scoped to C9up/sigil read access.
      - name: Checkout sigil into workspace stub
        uses: actions/checkout@v4
        with:
          repository: C9up/sigil
          path: ws/packages/sigil
          ref: main

      # Synthesize a pnpm-workspace.yaml so `workspace:*` resolves locally.
      - name: Synthesize workspace root
        shell: bash
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          packages:
            - "packages/*"
          EOF
          cat > package.json <<'EOF'
          { "name": "ream-dev-ci-stub", "private": true }
          EOF

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build NAPI binary
        run: pnpm --filter @c9up/warden build:napi

      - name: Vitest (unit only — integration imports sigil at runtime)
        run: pnpm --filter @c9up/warden test --run tests/unit --reporter=json --outputFile=test-results.json
        shell: bash

      - name: Smoke gate — tests ran AND zero skipped (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ ! -f packages/warden/test-results.json ]; then
            echo "::error::test-results.json not produced — pnpm test failed before writing"
            exit 1
          fi
          total=$(jq '[.testResults[].assertionResults[]] | length' packages/warden/test-results.json)
          if [ "$total" -eq 0 ]; then
            echo "::error::0 tests ran — test discovery is broken (check vitest include glob)"
            exit 1
          fi
          skipped=$(jq '[.testResults[].assertionResults[] | select(.status=="skipped")] | length' packages/warden/test-results.json)
          if [ "$skipped" -ne 0 ]; then
            echo "::error::$skipped tests skipped — check NAPI binary load path"
            exit 1
          fi
        shell: bash

      - name: Smoke gate — tests ran AND zero skipped (Windows)
        if: runner.os == 'Windows'
        run: |
          $path = "packages/warden/test-results.json"
          if (-not (Test-Path $path)) {
            Write-Error "test-results.json not produced — pnpm test failed before writing"
            exit 1
          }
          $total = python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(1 for r in d['testResults'] for a in r['assertionResults']))" $path
          if ([int]$total -eq 0) {
            Write-Error "0 tests ran — test discovery is broken (check vitest include glob)"
            exit 1
          }
          $skipped = python -c "import json,sys; d=json.load(open(sys.argv[1])); print(sum(1 for r in d['testResults'] for a in r['assertionResults'] if a['status']=='skipped'))" $path
          if ([int]$skipped -ne 0) {
            Write-Error "$skipped tests skipped — check NAPI binary load path"
            exit 1
          }
        shell: pwsh

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: warden-napi-${{ matrix.suffix }}
          path: ws/packages/warden/index.${{ matrix.suffix }}.node
          if-no-files-found: error

  cargo-tests:
    name: Cargo tests (linux-x64-gnu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  # Publish job — gated on workflow_dispatch (manual maintainer trigger).
  # DISABLED until Story 52.4 Decision C clears.
  # See _bmad-output/implementation-artifacts/52-1-napi-ci-multi-platform-sweep.md AC6.
