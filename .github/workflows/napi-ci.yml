  #     - uses: pnpm/action-setup@v4
  #       with: { version: 9 }
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '22'
  #         registry-url: 'https://registry.npmjs.org'
  #     - name: Verify NPM_TOKEN secret
  #       run: |
  #         if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
  #           echo "::error::NPM_TOKEN secret missing — set in repo settings before manual publish"
  #           exit 1
  #         fi
  #     - run: pnpm install
  #     - uses: actions/download-artifact@v4
  #       with:
  #         pattern: warden-napi-*
  #         merge-multiple: true
